<link rel="stylesheet" href="./estilos/style.css">
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fas fa-crown"></i> La <span class="logo-sub">Pastelería</span></a>
            <a href="index.html" class="nav-link">← Volver al inicio</a>
        </div>
    </nav>

    <main class="auth-container" style="margin-top: 80px;">
        <form class="auth-form" action="login.html">
            <h2>Crear Cuenta</h2>
            
            <div class="campo">
                <label for="nombre_reg">Nombre Completo:</label>
                <input type="text" id="nombre_reg" name="nombre" required class="form-group">
            </div>

            <div class="campo">
                <label for="email_reg">Correo Electrónico:</label>
                <input type="email" id="email_reg" name="email" required class="form-group">
            </div>
            
            <div class="campo">
                <label for="pass_reg">Contraseña:</label>
                <input type="password" id="pass_reg" name="password" required class="form-group">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                ¿Ya tienes cuenta? <a href="login.html" style="color: var(--c-naranja);">Inicia sesión</a>
            </p>
        </form>
    </main>
</body>
